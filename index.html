<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Randazoid Card #001</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at top, #44306f 0%, #181326 40%, #08080c 100%);
  font-family: Arial, sans-serif;
  color: white;
  overflow-x: hidden;
}

h1 {
  margin: 20px 10px 6px;
  text-align: center;
  font-size: 28px;
}

.subtitle {
  margin-bottom: 18px;
  opacity: .8;
  font-size: 14px;
}

.card {
  width: min(88vw, 390px);
  aspect-ratio: 3 / 4;
  perspective: 1200px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform .7s;
  transform-style: preserve-3d;
}

.card.flipped .card-inner {
  transform: rotateY(180deg);
}

.card-front,
.card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 22px;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  box-shadow:
    0 18px 45px rgba(0,0,0,.55),
    0 0 25px rgba(255,255,255,.10);
}

.card-back {
  transform: rotateY(180deg);
}

.card img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.hint {
  margin: 18px 0 25px;
  font-size: 14px;
  opacity: .75;
}
</style>
</head>

<body>

<h1>Randazoid</h1>
<div class="subtitle">COLLECTOR CARD #001</div>

<div class="card" id="card" onclick="flipCard()">
  <div class="card-inner">

    <div class="card-front">
      <img
        src="randazoid-card-001-front.png"
        alt="Randazoid Card 001 Front">
    </div>

    <div class="card-back">
      <img
        src="randazoid-card-001-back.png"
        alt="Randazoid Card 001 Back">
    </div>

  </div>
</div>

<div class="hint">Tap the card to flip it ✨</div>

<script>
function flipCard() {
  document.getElementById("card").classList.toggle("flipped");
}
</script>

</body>
</html>
